services:
  db:
    image: postgres:16-alpine
    container_name: menumind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menumind_user
      POSTGRES_PASSWORD: menumind_pass
      POSTGRES_DB: menumind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menumind_user -d menumind"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: menumind_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://menumind_user:menumind_pass@db:5432/menumind
      SECRET_KEY: replace-this-with-a-real-secret-before-deploy
      DEBUG: "false"
      AUTO_CREATE_TABLES: "true"
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: menumind_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
