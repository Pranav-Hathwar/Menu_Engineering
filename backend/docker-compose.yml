services:
  db:
    image: postgres:16-alpine
    container_name: menumind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menumind_user
      # Override in production: export POSTGRES_PASSWORD before `docker compose up`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menumind_pass}
      POSTGRES_DB: menumind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menumind_user -d menumind"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: menumind_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://menumind_user:${POSTGRES_PASSWORD:-menumind_pass}@db:5432/menumind
      # Must be supplied from the host environment; compose refuses to start
      # without it. Generate one: python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in your shell before deploying}
      DEBUG: "false"
      AUTO_CREATE_TABLES: "true"
      MAX_UPLOAD_BYTES: "10485760"
      # The web container proxies /api same-origin, so CORS is mostly a safety net.
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python is always present in the image; curl is not.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: menumind_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
