server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must exceed the API's MAX_UPLOAD_BYTES (10 MB) or nginx 413s uploads
    # before they ever reach the backend.
    client_max_body_size 12m;

    # Compress text assets; the charts/vendor JS bundles shrink ~3x.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames, so assets are safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
